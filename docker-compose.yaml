services:
  postgres:
    image: postgres:16
    container_name: postgres_16_db
    environment:
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: mypassword
      POSTGRES_DB: mydb
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init-db:/docker-entrypoint-initdb.d
      - ./data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U myuser -d mydb"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - dbt-net

  airflow:
    build:
      context: .
      dockerfile: Dockerfile.airflow
    container_name: airflow_orchestrator
    environment:
      - AIRFLOW__CORE__EXECUTOR=SequentialExecutor
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=sqlite:////opt/airflow/airflow.db
      - AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS=True  # Bypasses login in Airflow 3.3.2
    ports:
      - "8080:8080"
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./dbt/airflow_dbt_postgres:/opt/airflow/dbt
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - dbt-net
    command: airflow standalone

volumes:
  pgdata:

networks:
  dbt-net:
    driver: bridge