services:
  postgres:
    image: postgres:16-bookworm
    container_name: postgres_db
    environment:
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: mypassword
      POSTGRES_DB: mydb
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init-db:/docker-entrypoint-initdb.d  # Automatically executes scripts here on first run
      - ./data:/app/data

volumes:
  pgdata: