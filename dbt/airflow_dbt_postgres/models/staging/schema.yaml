version: 2

sources:
  - name: public
    database: mydb
    schema: public
    tables:
      - name: customers
      - name: orders

models:
  - name: stg_customers
    description: "Cleaned customer profiles with extracted JSON attributes."
    columns:
      - name: customer_id
        tests:
          - unique
          - not_null
      - name: email
        tests:
          - not_null

  - name: stg_orders
    description: "Flattened order line items derived from JSONB arrays."
    columns:
      - name: order_id
        tests:
          - not_null
      - name: customer_id
        tests:
          - not_null
          - relationships:
              to: ref('stg_customers')
              field: customer_id